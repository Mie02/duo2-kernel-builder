name: Build Surface Duo 2 Custom Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Target Defconfig'
        required: true
        default: 'lahaina-gki_defconfig'
        type: choice
        options:
          - 'lahaina-gki_defconfig'
          - 'lahaina-qgki_defconfig'
      enable_ksu:
        description: 'Embed KernelSU Driver (Native Stealth Root)'
        required: true
        type: boolean
        default: true
      enable_bbr:
        description: 'Enable In-Kernel BBR TCP Congestion Control'
        required: true
        type: boolean
        default: true
      enable_wireguard:
        description: 'Enable In-Kernel WireGuard VPN Protocol'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Compile Duo 2 Kernel (${{ github.event.inputs.defconfig }})
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Runner Disk Space (~45GB reclaimed)
        run: |
          echo "Initial disk space:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup 2>/dev/null || true
          echo "Disk space after cleanup:"
          df -h

      - name: Install Build Prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses-dev \
            libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            libssl-dev libxml-simple-perl libc++1 libc++-dev python3 python-is-python3 bc jq
          sudo apt-get install -y libncurses5 2>/dev/null || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 2>/dev/null || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 2>/dev/null || true

      - name: Setup repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize & Sync Kernel Tree
        run: |
          git config --global user.name "Duo2Builder"
          git config --global user.email "duo2builder@github.com"
          mkdir -p workspace
          cd workspace

          # Initialize using local fixed manifest (replaces dead CAF with AOSP mirrors)
          repo init -u https://github.com/microsoft/surface-duo-oss-kernel.manifest -b surfaceduo2/11/2022.823.41 --depth=1
          cp ../manifest-fixed.xml .repo/manifests/default.xml

          echo "Syncing kernel sources (shallow depth)..."
          repo sync -c -j$(nproc --all) --no-clone-bundle --no-tags

      - name: Integrate KernelSU
        if: ${{ github.event.inputs.enable_ksu == 'true' }}
        run: |
          cd workspace/kernel/msm-5.4
          echo "Applying KernelSU integration to Linux 5.4 kernel tree..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          echo "KernelSU patch applied successfully."

      - name: Apply Defconfig Tweaks (BBR, WireGuard, Kprobes)
        run: |
          cd workspace/kernel/msm-5.4/arch/arm64/configs/vendor
          TARGET_CONFIG="${{ github.event.inputs.defconfig }}"
          echo "Patching $TARGET_CONFIG..."

          # Kprobes for root stealth
          echo "CONFIG_KPROBES=y" >> $TARGET_CONFIG
          echo "CONFIG_HAVE_KPROBES=y" >> $TARGET_CONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $TARGET_CONFIG

          # BBR TCP congestion
          if [ "${{ github.event.inputs.enable_bbr }}" = "true" ]; then
            echo "CONFIG_TCP_CONG_BBR=y" >> $TARGET_CONFIG
            echo "CONFIG_DEFAULT_TCP_CONG=\"bbr\"" >> $TARGET_CONFIG
            echo "[OK] In-Kernel BBR enabled"
          fi

          # WireGuard
          if [ "${{ github.event.inputs.enable_wireguard }}" = "true" ]; then
            echo "CONFIG_WIREGUARD=y" >> $TARGET_CONFIG
            echo "[OK] In-Kernel WireGuard enabled"
          fi

      - name: Compile Surface Duo 2 Kernel
        run: |
          cd workspace
          export BUILD_PATH=$PWD
          export T=$PWD
          
          echo "Starting official Microsoft kernel-build.sh..."
          bash device_build/kernel/kernel-build.sh -c ${{ github.event.inputs.defconfig }} -p $PWD

      - name: Package Kernel & AnyKernel3
        run: |
          mkdir -p output
          cd workspace
          
          KERNEL_IMAGE=$(find out/target/product/duo2/ -name Image -type f | head -n 1)
          if [ -z "$KERNEL_IMAGE" ]; then
            echo "Error: Compiled Image not found!"
            exit 1
          fi
          echo "Found compiled kernel Image: $KERNEL_IMAGE"
          cp "$KERNEL_IMAGE" ../output/Image
          
          # Collect vendor modules
          find out/target/product/duo2/ -name "*.zip" -exec cp {} ../output/ \; 2>/dev/null || true
          
          cd ../output
          # Prepare AnyKernel3 packaging
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel_dir
          cd anykernel_dir
          sed -i 's/device.name1=.*/device.name1=duo2/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=surface_duo_2/g' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=zeta/g' anykernel.sh
          sed -i 's/block=.*/block=auto;/g' anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=auto;/g' anykernel.sh
          cp ../Image ./Image
          zip -r9 ../SurfaceDuo2-CustomKernel-AnyKernel3.zip * -x .git .gitignore
          cd ..
          rm -rf anykernel_dir

          ls -la

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SurfaceDuo2-Kernel-${{ github.event.inputs.defconfig }}
          path: output/
          retention-days: 14
