name: Build Surface Duo 2 Custom Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Target Defconfig'
        required: true
        default: 'lahaina-gki_defconfig'
        type: choice
        options:
          - 'lahaina-gki_defconfig'
          - 'lahaina-qgki_defconfig'
      enable_ksu:
        description: 'Embed KernelSU Driver (Native Stealth Root)'
        required: true
        type: boolean
        default: true
      enable_bbr:
        description: 'Enable In-Kernel BBR TCP Congestion Control'
        required: true
        type: boolean
        default: true
      enable_wireguard:
        description: 'Enable In-Kernel WireGuard VPN Protocol'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main

jobs:
  build:
    name: Compile Duo 2 Kernel (${{ github.event.inputs.defconfig || 'lahaina-gki_defconfig' }})
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Runner Disk Space (~45GB reclaimed)
        run: |
          echo "Initial disk space:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup 2>/dev/null || true
          echo "Disk space after cleanup:"
          df -h

      - name: Install Build Prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses-dev \
            libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            libssl-dev libxml-simple-perl libc++1 libc++-dev python3 python-is-python3 bc jq
          sudo apt-get install -y libncurses5 2>/dev/null || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 2>/dev/null || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 2>/dev/null || true

      - name: Setup repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync Microsoft Kernel Source Tree
        run: |
          git config --global user.name "Duo2Builder"
          git config --global user.email "duo2builder@github.com"
          mkdir -p workspace
          cd workspace

          repo init -u https://github.com/microsoft/surface-duo-oss-kernel.manifest -b surfaceduo2/11/2022.823.41 --depth=1
          cp ../manifest-fixed.xml .repo/manifests/default.xml

          echo "Syncing Microsoft kernel repositories..."
          repo sync -c -j$(nproc --all) --no-clone-bundle --no-tags

      - name: Download AOSP Prebuilt Toolchains
        run: |
          cd workspace
          echo "Cloning AOSP prebuilt GCC, host tools, and build-tools (depth=1)..."
          git clone --depth=1 -b master-kernel-build-2021 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          git clone --depth=1 -b master-kernel-build-2021 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9
          git clone --depth=1 -b master-kernel-build-2021 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8 prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8
          git clone --depth=1 -b master-kernel-build-2021 https://android.googlesource.com/platform/prebuilts/build-tools prebuilts/build-tools
          git clone --depth=1 -b master-kernel-build-2021 https://android.googlesource.com/kernel/configs kernel/configs

          echo "Cloning AOSP Clang toolchain (sparse-checkout for clang-r416183b)..."
          git clone --depth=1 --filter=blob:none --sparse -b master-kernel-build-2021 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 prebuilts/clang/host/linux-x86
          (cd prebuilts/clang/host/linux-x86 && git sparse-checkout set clang-r416183b)

          # Provide fallback aarch64-linux-android-gcc symlink in case any legacy Makefile invokes gcc
          ln -sf $PWD/prebuilts/clang/host/linux-x86/clang-r416183b/bin/clang prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-gcc 2>/dev/null || true

          echo "Verifying toolchains:"
          test -f prebuilts/clang/host/linux-x86/clang-r416183b/bin/clang && echo "[OK] Clang compiler found" || (echo "[FAIL] Missing Clang" && exit 1)
          test -f prebuilts/clang/host/linux-x86/clang-r416183b/bin/ld.lld && echo "[OK] LLD linker found" || (echo "[FAIL] Missing LLD" && exit 1)
          test -f prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-as && echo "[OK] AArch64 binutils found" || (echo "[FAIL] Missing binutils" && exit 1)
          test -f prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8/bin/x86_64-linux-ar && echo "[OK] Host AR found" || (echo "[FAIL] Missing Host AR" && exit 1)
          test -f prebuilts/build-tools/linux-x86/bin/make && echo "[OK] Build-tools make found" || (echo "[FAIL] Missing make" && exit 1)

      - name: Integrate KernelSU
        if: ${{ github.event.inputs.enable_ksu == 'true' || github.event_name == 'push' }}
        run: |
          cd workspace/kernel/msm-5.4
          echo "Applying KernelSU integration to Linux 5.4 kernel tree..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

          echo "Applying Linux 5.4 compatibility backports for KernelSU..."
          # 1. Provide include/linux/pgtable.h wrapper (introduced in Linux 5.8)
          if [ ! -f "include/linux/pgtable.h" ]; then
            echo "Creating include/linux/pgtable.h wrapper..."
            printf '/* SPDX-License-Identifier: GPL-2.0 */\n#ifndef _LINUX_PGTABLE_H\n#define _LINUX_PGTABLE_H\n#include <asm/pgtable.h>\n#endif /* _LINUX_PGTABLE_H */\n' > include/linux/pgtable.h
          fi

          # 2. Add Linux 5.4 nofault API compatibility macros to include/linux/uaccess.h
          cat << 'EOF' >> include/linux/uaccess.h

/* Linux 5.4 LTS compatibility for 5.8+ nofault API */
#ifndef copy_to_kernel_nofault
#define copy_to_kernel_nofault probe_kernel_write
#endif
#ifndef copy_from_kernel_nofault
#define copy_from_kernel_nofault probe_kernel_read
#endif
#ifndef strncpy_from_user_nofault
#define strncpy_from_user_nofault strncpy_from_unsafe_user
#endif
#ifndef copy_from_user_nofault
#define copy_from_user_nofault copy_from_unsafe_user
#endif
#ifndef copy_to_user_nofault
#define copy_to_user_nofault copy_to_unsafe_user
#endif
EOF

          # 3. Patch direct source references in KernelSU tree
          find KernelSU/ drivers/kernelsu/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i \
            -e 's|<linux/pgtable.h>|<asm/pgtable.h>|g' \
            -e 's|copy_to_kernel_nofault|probe_kernel_write|g' \
            -e 's|copy_from_kernel_nofault|probe_kernel_read|g' \
            -e 's|strncpy_from_user_nofault|strncpy_from_unsafe_user|g' \
            -e 's|copy_from_user_nofault|copy_from_unsafe_user|g' \
            -e 's|copy_to_user_nofault|copy_to_unsafe_user|g' {} + 2>/dev/null || true

          echo "KernelSU patch and 5.4 backports applied successfully."

      - name: Apply Defconfig Tweaks (KernelSU, BBR, WireGuard, Kprobes)
        run: |
          cd workspace/kernel/msm-5.4
          TARGET_CONFIG="${{ github.event.inputs.defconfig || 'lahaina-gki_defconfig' }}"
          echo "Configuring kernel defconfig tweaks for $TARGET_CONFIG..."

          # Create custom fragment to be merged during generate_defconfig.sh
          CUSTOM_FRAG="arch/arm64/configs/vendor/duo2_custom.config"
          rm -f $CUSTOM_FRAG
          touch $CUSTOM_FRAG

          # Kprobes for root stealth (Mandatory for KernelSU)
          echo "CONFIG_KPROBES=y" >> $CUSTOM_FRAG
          echo "CONFIG_HAVE_KPROBES=y" >> $CUSTOM_FRAG
          echo "CONFIG_KPROBE_EVENTS=y" >> $CUSTOM_FRAG

          # KernelSU native driver
          if [ "${{ github.event.inputs.enable_ksu || 'true' }}" = "true" ]; then
            echo "CONFIG_KSU=y" >> $CUSTOM_FRAG
            echo "[OK] In-Kernel KernelSU enabled"
          fi

          # In-Kernel BBR
          if [ "${{ github.event.inputs.enable_bbr || 'true' }}" = "true" ]; then
            echo "CONFIG_TCP_CONG_BBR=y" >> $CUSTOM_FRAG
            echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> $CUSTOM_FRAG
            echo "[OK] In-Kernel BBR enabled"
          fi

          # In-Kernel WireGuard
          if [ "${{ github.event.inputs.enable_wireguard || 'true' }}" = "true" ]; then
            echo "CONFIG_WIREGUARD=y" >> $CUSTOM_FRAG
            echo "[OK] In-Kernel WireGuard enabled"
          fi

          # Append to base gki_defconfig and vendor lahaina_GKI.config so merge_config.sh preserves them
          cat $CUSTOM_FRAG >> arch/arm64/configs/gki_defconfig
          cat $CUSTOM_FRAG >> arch/arm64/configs/vendor/lahaina_GKI.config
          cat $CUSTOM_FRAG >> arch/arm64/configs/vendor/$TARGET_CONFIG

          # Also hook generate_defconfig.sh to ensure custom configs stay appended after savedefconfig
          sed -i 's|mv defconfig $CONFIGS_DIR/$REQUIRED_DEFCONFIG|mv defconfig $CONFIGS_DIR/$REQUIRED_DEFCONFIG; cat $CONFIGS_DIR/duo2_custom.config >> $CONFIGS_DIR/$REQUIRED_DEFCONFIG|g' scripts/gki/generate_defconfig.sh
          echo "Defconfig hooks applied successfully."

      - name: Compile Surface Duo 2 Kernel
        run: |
          cd workspace
          export BUILD_PATH=$PWD
          export T=$PWD
          
          echo "Starting official Microsoft kernel-build.sh..."
          bash device_build/kernel/kernel-build.sh -c ${{ github.event.inputs.defconfig || 'lahaina-gki_defconfig' }} -p $PWD

      - name: Package Kernel & AnyKernel3
        run: |
          mkdir -p output
          cd workspace
          
          KERNEL_IMAGE=$(find out/target/product/duo2/ -name Image -type f | head -n 1)
          if [ -z "$KERNEL_IMAGE" ]; then
            echo "Error: Compiled Image not found!"
            exit 1
          fi
          echo "Found compiled kernel Image: $KERNEL_IMAGE"
          cp "$KERNEL_IMAGE" ../output/Image
          
          # Collect vendor modules
          find out/target/product/duo2/ -name "*.zip" -exec cp {} ../output/ \; 2>/dev/null || true
          
          cd ../output
          # Prepare AnyKernel3 packaging
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel_dir
          cd anykernel_dir
          sed -i 's/device.name1=.*/device.name1=duo2/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=surface_duo_2/g' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=zeta/g' anykernel.sh
          sed -i 's/block=.*/block=auto;/g' anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=auto;/g' anykernel.sh
          cp ../Image ./Image
          zip -r9 ../SurfaceDuo2-CustomKernel-AnyKernel3.zip * -x .git .gitignore
          cd ..
          rm -rf anykernel_dir

          ls -la

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SurfaceDuo2-Kernel-${{ github.event.inputs.defconfig || 'lahaina-gki_defconfig' }}
          path: output/
          retention-days: 14
